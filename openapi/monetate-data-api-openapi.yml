          description: Data payload of this response.
          items:
            $ref: '#/components/schemas/SchemaType'
    Field:
      required:
      - data_type
      type: object
      properties:
        data_type:
          type: string
          description: |-
            The data type for this field.

            Monetate supports five data types: STRING, MULTI_STRING, NUMBER, DATETIME, and BOOLEAN.
          enum:
          - STRING
          - MULTI_STRING
          - BOOLEAN
          - DATETIME
          - NUMBER
          - GOOGLE_PRODUCT_CATEGORY
        identifier:
          type: boolean
          description: |-
            Indicates that this field can be linked to a Person ID for testing and targeting.

            The name of this schema.

            Schema names must begin with a letter and contain only letters, numbers, hyphens, and the underscore character.

            `data_type` must be a STRING.

            There must be exactly one Field designated as an identifier in your schema.
        unique_key:
          type: boolean
          description: |-
            Indicates that this field is a unique key.

            `data_type` must be a STRING.

            Optionally, one field may be designated as a unique key in your schema.
        event_time:
          type: boolean
          description: |-
            Indicates that this field represents the event time, the time which the event occurred.

            Must be data_type DATETIME.

            For schema's with type==event, there must be exactly 1 field marked as the event time.
      description: Representation of the properties of a Field within a Schema. Only
        appears within a Schema object's `fields` property.
    FileUpload:
      type: object
      properties:
        status:
          type: string
          description: The status of the file upload.
          enum:
          - PENDING
          - PROCESSING
          - COMPLETE
          - VALIDATION_ERROR
          - SYSTEM_ERROR
          - SKIPPED
          - TIMEOUT_ERROR
          - MAX_LOAD_ATTEMPTS_REACHED
        upload_time:
          type: string
          description: The time the file was uploaded to Monetate.
          format: date-time
          readOnly: true
        import_start_time:
          type: string
          description: The time Monetate began importing (validating) the file.
          format: date-time
          readOnly: true
        import_end_time:
          type: string
          description: The time Monetate completed importing (validating) the file.
          format: date-time
          readOnly: true
        validation_errors:
          type: array
          description: "The validation error, if any that occurred. Populated when\
            \ status is VALIDATION_ERROR."
          readOnly: true
          items:
            type: string
        validation_warnings:
          type: array
          description: "The validation warnings, if any occurred. Status may still\
            \ be COMPLETE."
          readOnly: true
          items:
            type: string
      description: A file upload attempt for a Schema.
      example:
        status: COMPLETE
        upload_date: 2016-09-30T12:10:45.000145Z
        import_start_time: 2016-09-30T12:10:45.000145Z
        import_end_time: 2016-09-30T12:10:45.000145Z
        validation_errors: ""
