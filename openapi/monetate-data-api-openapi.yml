      required:
      - schema_rows
      type: object
      properties:
        schema_rows:
          minItems: 0
          type: array
          items:
            required:
            - example_field1
            type: object
            properties:
              example_field1:
                type: string
              example_field2:
                type: string
                format: date-time
              example_field3:
                type: boolean
              example_field4:
                type: number
              example_field5:
                type: string
      description: Representation of the `fields` for this Schema.
      example:
        schema_rows:
        - example_field1: example string
          example_field2: 2016-09-30T12:10:45.000145Z
          example_field3: true
          example_field4: 10.5
          example_field5: "example,secondexample"
