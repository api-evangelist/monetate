  responses:
    "400-Validation-Error":
      description: "Validation error. \n\nOne or more values being sent was not in\
        \ the correct format, or a required value was missing."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "401-Unauthorized":
      description: "Unauthorized. \n\nThe request did not include a token, or the\
        \ token provided was invalid. Please ensure that your token is correct and\
        \ that the Authorization header is properly formatted."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "403-Forbidden":
      description: |-
        Forbidden.

        The request included a token that has been revoked. Please contact your account administrator to generate a new token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "404-Not-Found":
      description: |-
        Not found.

        The resource you are trying to fetch does not exist, or has been deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "429-Too-Many-Requests":
      description: |-
        Too many requests.

        The user has sent too many requests in a given amount of time to a rate-limited endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "500-Server-Error":
      description: |-
        Unknown error.

        Please try again or contact your account manager for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    "200-Schema-List":
      description: A list of Schema definitions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaListResponse'
    "200-Schema":
      description: A single Schema definition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaResponse'
    "200-SchemaType-List":
      description: A list of Schema Types.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaTypeListResponse'
    "200-SchemaType":
      description: A Schema Type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaTypeResponse'
    "201-Schema-Created":
      description: Schema created. Content is the definition of the created Schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaResponse'
        meta:
          example:
            code: 201
        data:
          example:
            name: purchase_event
            named_identifier: valid_named_identifier
            type: event
            fields:
              purchase_id:
                data_type: STRING
                unique_key: true
              customer_id:
                data_type: STRING
                identifier: true
              purchase_time:
                data_type: DATETIME
                event_time: true
              product_id:
                data_type: STRING
              product_category:
                data_type: STRING
              product_price:
                data_type: NUMBER
    "200-Schema-Patched":
      description: Schema patched. Content is the definition of the modified Schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchemaPatchResponse'
        meta:
          example:
            code: 200
        data:
          example:
            fields:
              existing_field:
                data_type: STRING
                unique_key: true
              new_field:
                data_type: STRING
            named_identifier: valid_named_identifier
    "200-FileUpload-List":
      description: A list of file uploads.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileUploadListResponse'
    "200-DefaultAccountCatalog-List":
      description: A list of default account catalogs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultAccountCatalogListResponse'
    "201-DefaultAccountCatalog-Created":
      description: The defaulted product catalog and account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultAccountCatalogCreatedResponse'
        meta:
          example:
            code: 201
        data:
          example:
            account: "123"
            schema: "456"
    "201-DefaultAccountCatalog-Bulk-Created":
      description: A list of the defaulted product catalogs and accounts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultAccountCatalogBulkCreatedResponse'
    "204-Data-Deleted":
      description: Schema deleted. No content.
      content: {}
    "200-CustomerDataPrivacy-List":
      description: A status report for a specific customer_id.
      content: {}
  parameters:
    schema-name:
      name: schema-name
      in: path
      description: The name of the Schema.
      required: true
      schema:
        type: string
    schema-type:
      name: schema-type
      in: path
      description: Name of the schema type.
      required: true
      schema:
        type: string
  securitySchemes:
    Token Authentication:
      type: apiKey
      description: |-
        The Monetate Data API uses Token Authentication, so requests to the Data API must include a valid, active authentication token. Include an `Authorization` header with the value `Token [token_string]` with every request. See [Auth API](https://developer.monetate.com/auth-api) for information on obtaining the *token_string*.
      name: Authorization
      in: header
