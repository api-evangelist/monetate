limit_count: 0
note: >-
  Monetate publishes NO numeric rate limits and NO rate-limit response headers. The only evidence that any
  throttling exists is a single declared 429 response — "Too many requests. The user has sent too many
  requests in a given amount of time to a rate-limited endpoint." — on GET /data/{schema_name}/ in the
  Data API spec. That is the entire published surface: the phrase "a rate-limited endpoint" confirms
  limits are enforced, while naming neither the window, the ceiling, the scope, nor a Retry-After. The
  Engine API — the high-volume, per-page-view endpoint where an agent most needs a budget — declares only
  200 and 400 and says nothing about throttling at all. Searched the Engine API, Data API, Metadata API
  and Auth API documentation spaces plus the Monetate knowledge base; no limits page exists.
  A limit_count of 0 here is a real finding about the provider, not an unchecked field.
