apis:
- name: Monetate Engine API
  description: >-
    RESTful entry point to the Monetate decision engine. A client POSTs a batch of context events, page events
    and record events for a session and receives back the actions (experiences) the engine decided to serve —
    usable from a server, a browser, a mobile app, a single-page app, or non-web channels such as in-store
    displays, kiosks and SMS. Regional endpoints are available alongside the default host.
  humanURL: https://developer.monetate.com/engine-api
  baseURL: https://engine.monetate.net/api/engine/v1
  tags:
  - Decision Engine
  - Personalization
  - A/B Testing
  - Ecommerce
  properties:
  - type: OpenAPI
    url: openapi/monetate-engine-api-openapi.yml
  - type: Documentation
    url: https://developer.monetate.com/engine-api
  - type: APIReference
    url: https://developer.monetate.com/engine-api/monetate-engine-api
  - type: GettingStarted
    url: https://developer.monetate.com/engine-api/engine-api-startup-guide
  - type: Overlay
    url: overlays/monetate-engine-api-overlay.yaml
- name: Monetate Data API
  description: >-
    Create and manage data schemas and send customer, product and catalog data into Monetate in real time for use
    by the decision engine. Covers schema CRUD, schema types, upload history, row-level data POST/GET and default
    product-catalog assignment (single and bulk), plus customer data-privacy operations.
  humanURL: https://developer.monetate.com/data-api
  baseURL: https://api.monetate.net/api/data/v1/{retailerShortname}/production
  tags:
  - Customer Data
  - Product Data
  - Data Ingestion
  - Ecommerce
  properties:
  - type: OpenAPI
    url: openapi/monetate-data-api-openapi.yml
  - type: Documentation
    url: https://developer.monetate.com/data-api
  - type: APIReference
    url: https://developer.monetate.com/data-api/monetate-data-api
  - type: RateLimits
    url: rate-limits/monetate-rate-limits.yml
  - type: Overlay
    url: overlays/monetate-data-api-overlay.yaml
- name: Monetate Metadata API
  description: >-
    Read-only API returning metadata about a Monetate account so that experience, page-event and custom-target
    identifiers seen in engine responses and analytics exports can be resolved to human-interpretable names.
    Covers accounts, experiences (variants), experience summaries, page events and custom targets.
  humanURL: https://developer.monetate.com/metadata-api
  baseURL: https://api.monetate.net/api/metadata/v1/{retailerShortname}/production
  tags:
  - Metadata
  - Analytics
  - Reporting
  properties:
  - type: OpenAPI
    url: openapi/monetate-metadata-api-openapi.yml
  - type: Documentation
    url: https://developer.monetate.com/metadata-api
  - type: APIReference
    url: https://developer.monetate.com/metadata-api/monetate-metadata-api
  - type: Overlay
    url: overlays/monetate-metadata-api-overlay.yaml
- name: Monetate Auth API
  description: >-
    Issues and refreshes the bearer tokens used by the Data API and Metadata API. A signed JWT user key is
    exchanged for a token with a caller-specified TTL; the token is then sent as an `Authorization: Token
    <token_string>` header on every subsequent API call.
  humanURL: https://developer.monetate.com/auth-api
  baseURL: https://api.monetate.net/api/auth/v0
  tags:
  - Authentication
  - Tokens
  properties:
  - type: OpenAPI
    url: openapi/monetate-auth-api-openapi.yml
  - type: Documentation
    url: https://developer.monetate.com/auth-api
  - type: Authentication
    url: authentication/monetate-authentication.yml
  - type: Overlay
    url: overlays/monetate-auth-api-overlay.yaml
- name: Monetate Website MCP Server
  description: >-
    Hosted Model Context Protocol server published on the monetate.com marketing site, advertised through RFC 8414
    OAuth authorization-server metadata and RFC 9728 protected-resource metadata. Provided by the AI Engine
    WordPress plugin. The MCP endpoint answers 401 with a Bearer challenge to anonymous callers, so the live tool
    list requires an authenticated OAuth session.
  humanURL: https://monetate.com/.well-known/oauth-protected-resource
  baseURL: https://monetate.com/wp-json/mcp/v1/http
  tags:
  - MCP
  - Agent
  properties:
  - type: MCPServer
    url: mcp/monetate-mcp.yml
  - type: MCPServer
    url: https://monetate.com/wp-json/mcp/v1/http
  - type: ToolCrosswalk
    url: mcp/monetate-tool-crosswalk.yml
  - type: WellKnown
    url: well-known/monetate-well-known.yml
