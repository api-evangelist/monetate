aid: monetate
name: Monetate
description: >-
  Monetate is an enterprise experience-optimization and personalization platform for ecommerce and digital
  businesses, delivering A/B and multivariate testing, automated 1:1 personalization, product and content
  recommendations, personalized search, dynamic bundles, social proof and product badging across web, mobile,
  email and in-store channels. Its decision engine is exposed to developers through four public REST APIs — the
  Engine API (real-time decision requests), the Data API (schema definition, customer/product data ingestion and
  default catalog management), the Metadata API (accounts, experiences, page events and custom targets) and the
  Auth API (bearer-token issue and refresh) — plus a browser JavaScript API and native SDKs for iOS, Android,
  React Web and React Native. Monetate operates as part of Kibo Commerce.
