source: >-
  https://developer.monetate.com/sdks/monetate-sdk-install plus live registry metadata reads against
  registry.npmjs.org, trunk.cocoapods.org, monetate.jfrog.io (Artifactory npm + maven-layout repos) and
  the github.com/monetate organization
note: >-
  Monetate ships first-party SDKs for iOS, Android, React Web and React Native, but almost none of them are
  distributed through a public package registry. The JavaScript packages are published to Monetate's own
  JFrog Artifactory npm repo — the docs literally instruct the developer to repoint their global npm
  registry with `npm config set registry https://monetate.jfrog.io/artifactory/api/npm/monetate-npm-local`
  — and the Android SDK is a bare .jar the developer downloads from Artifactory and drops into `app/libs`
  with `implementation fileTree(...)`. Neither `monetate` nor `@personalization-js-sdk/*` exists on
  npmjs.com, PyPI, RubyGems or Packagist. Only the iOS SDK reaches a public registry (CocoaPods trunk,
  plus a Swift Package Manager repo on GitHub added in 2026.02.03). Versions below were read from each
  registry's own metadata endpoint on the generated date.
