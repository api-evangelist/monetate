note: 'Monetate publishes a real, discoverable MCP server — but on the monetate.com WordPress marketing
  site, not on the product API. It is served by the AI Engine WordPress plugin (resource_documentation
  points at https://meowapps.com/ai-engine/), and it is advertised correctly: RFC 8414 authorization-server
  metadata and RFC 9728 protected-resource metadata both resolve at the site root. An anonymous JSON-RPC
  tools/list POST returns HTTP 401 with `WWW-Authenticate: Bearer realm="MCP", resource_metadata="https://monetate.com/wp-json/mcp/v1/.well-known/oauth-protected-resource"`,
  so the live tool list and its inputSchemas require an authenticated OAuth session. NO tool list is recorded
  here because none could be read — nothing has been guessed or derived. There is no MCP server for the
  Engine, Data, Metadata or Auth APIs.'
