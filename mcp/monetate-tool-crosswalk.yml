  not two projections of one core: the MCP server is published by the AI Engine WordPress plugin on the
  monetate.com marketing site, while the OpenAPIs describe the product APIs on engine.monetate.net and
  api.monetate.net. There is no MCP surface over the decision engine, the data pipeline or the account
