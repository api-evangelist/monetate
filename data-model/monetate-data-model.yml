envelope_types:
  note: >-
    Every API also defines wrapper schemas (Response, ResponseMeta, ResponsePagination,
    ResponseMetaPagination, ResponseAnyData, and one `<Entity>Response` / `<Entity>ListResponse` pair per
    entity). These are transport, not domain, and are excluded from entities[] above.
  count: 25
id_conventions:
