note: >-
  Monetate keeps a genuinely long-running, dated platform changelog — a page per year going back to 2017 —
  and publishes each release as a bulleted list, unusually including an "Internal Distribution Only" block
  with the underlying ticket IDs (CD3-, REC-, SDKF-, UU-, DEC3-). It is a product changelog, not an API
  changelog: API-affecting changes appear only when they happen to be part of a platform release (for
  example "CD3-3171 Engine API not returning Experience API-created Omni Experiences with Action
  Conditions added after creation" and "CD3-3214 New schema_type 'catalog_subkey' for inventory feed").
  TWO PROBLEMS AN INTEGRATOR SHOULD KNOW ABOUT. First, cadence collapsed: 2025 carries 26 entries at a
  clean fortnightly rhythm from 2 January through 16 December, while the 2026 page carries only four, the
  newest of which was published roughly six months before this profile was generated. Second, every entry
  on the page titled "2026 Release Notes" is labelled with the year 2025 — "January 6th, 2025",
  "February 10th, 2025" — which is a year typo in the provider's own headings (the 2025 page separately
  and completely covers 2 January to 16 December 2025). The dates below are recorded exactly as the
  provider prints them; the `year_label_suspect` flag marks the ones that are almost certainly 2026.
